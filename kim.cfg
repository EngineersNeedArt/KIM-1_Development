# kim.cfg -- shared ld65 layout for KIM-1 / PAL-2 programs (1K RAM)
#
#   $0000-$00EE  PAGE0  zero page ($00EF-$00FF belong to the monitor)
#   $0100-$01FF  PAGE1  stack page: the stack grows down from $01FF, so
#                       keep the top of this page clear
#   $0200-$03FF  MAIN   main program area
#
# One binary per area: <name>-zp.bin, <name>-low.bin, <name>.
# An area with nothing in it produces an empty file.
#
#   ZPDATA    bytes loaded into zero page; must come before ZEROPAGE
#   ZEROPAGE  zero-page variables (nothing stored in the binary)
#   PAGE1     bytes loaded into page 1 (code or data)
#   CODE      main code, from $0200 (the default segment)
#   RODATA    constant data, after CODE
#   DATA      writable initialised data, after RODATA

MEMORY {
    PAGE0: file = "%O-zp.bin",  start = $0000, size = $00EF, type = rw;
    PAGE1: file = "%O-low.bin", start = $0100, size = $0100, type = rw;
    MAIN:  file = %O,           start = $0200, size = $0200, type = rw;

    # THE FOLLOWING ARE DEPRECATED
#    ZP:  file = "",  start = $0000, size = $00EF, type = rw;
#    LOW: file = "%O-low.bin", start = $0100, size = $0100, type = rw;
#    RAM: file = %O,  start = $0200, size = $0200, type = rw;
#    ZPLOAD: file = "%O-zp.bin", start = $0000, size = $00EF, type = ro;
}
SEGMENTS {
    ZPDATA:   load = PAGE0, type = ro, optional = yes;
    ZEROPAGE: load = PAGE0, type = zp;
    PAGE1:    load = PAGE1, type = ro, optional = yes;
    CODE:     load = MAIN,  type = ro;
    RODATA:   load = MAIN,  type = ro, optional = yes;
    DATA:     load = MAIN,  type = rw, optional = yes;

    # THE FOLLOWING ARE DEPRECATED
 #   ZEROPAGE: load = ZP,  type = zp;
 #   LOWCODE:  load = LOW, type = ro, optional = yes;
 #   CODE:     load = RAM, type = ro;
 #   RODATA:   load = RAM, type = ro, optional = yes;
 #   DATA:     load = RAM, type = rw, optional = yes;
 #   ZPLOAD:   load = ZPLOAD, type = ro, optional = yes;
}