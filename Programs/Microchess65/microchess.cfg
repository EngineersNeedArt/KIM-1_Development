# ld65 config for microchess.s -- flat image, load at $0000
# (gaps -- board variables, $0050-$006F, $00B0-$00BF, $0150-$01FF etc. --
#  are zero-filled so the image can be loaded in one piece)
MEMORY {
    RAM: file = %O, start = $0000, size = $17E7, type = rw, fill = yes, fillval = $00;
}
SEGMENTS {
    START:  load = RAM, type = ro, start = $0000;
    TABLES: load = RAM, type = ro, start = $0070;
    JANUS:  load = RAM, type = ro, start = $0100;
    GEN:    load = RAM, type = ro, start = $0200;
    STRAT:  load = RAM, type = ro, start = $1780;
}
